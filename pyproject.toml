[project]
name = "sanad"
version = "0.1.0"
description = "Authenticity Validator for Academia (SIH25029)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "pynacl>=1.5.0",
    "canonicaljson>=2.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.2.0",
    "pillow>=10.3.0",
    "reportlab>=4.2.0",
    "qrcode[pil]>=7.4.2",
    "minio>=7.2.7",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "hypothesis>=6.103.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pip-audit>=2.7.3",
]
forensics = [
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
    "scikit-image>=0.23.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
